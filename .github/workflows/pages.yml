name: Deploy PHASIS docs to Pages

# MANUAL POR ENQUANTO. O repositorio e PRIVADO, e Pages em repositorio
# privado exige plano pago -- alem de publicar o site PUBLICAMENTE, o que
# tiraria docs/ do privado. Enquanto essa decisao nao for tomada, o
# gatilho automatico so produziria uma falha vermelha a cada push.
#
# Para ligar: descomente o bloco `push` abaixo e rode uma vez.
#
# on:
#   push:
#     branches: [main]
#     paths: ["docs/**", ".github/workflows/pages.yml"]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        # enablement: true cria o site de Pages na primeira execucao, em vez
        # de exigir Settings -> Pages -> Source -> GitHub Actions na mao.
        # Sem isso o passo falha com "Get Pages site failed ... Not Found".
        with:
          enablement: true
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
