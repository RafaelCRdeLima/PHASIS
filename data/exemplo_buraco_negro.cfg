# PHASIS -- CASO DE ESTRESSE NUMERICO, NAO CENARIO FISICO.
#
# Varre o parametro de impacto atravessando b_crit = 2.5980762 r_s, para
# exibir captura, regime quase-critico e deflexao no mesmo arquivo.
#
# ATENCAO: r_in = 1.5 r_s poe materia NA esfera de fotons. Isso e
# deliberado -- serve para exercitar o caminho quase-critico com materia
# de verdade, e nao so com geometria. Mas e FISICAMENTE INCONSISTENTE
# para um disco: nao ha orbita circular estavel abaixo da ISCO, em
# 3 r_s. Nao leia este arquivo como cenario astrofisico.
#
# r_s(10 M_sol) = 2.95325e6 cm ;  b_crit = 7.6733e6 cm

metric  = schwarzschild
M_solar = 10.0

density    = powerlaw_halo
rho0_g_cm3 = 1.0e4
r0_cm      = 1.0e7
p          = 2.0
r_in_cm    = 4.5e6          # ~1.5 r_s, na esfera de fotons
r_out_cm   = 1.0e9

xsec       = table
table_path = dipole/data/sigma_nuN_CC_GBW.dat
xsec_current = cc

E_inf_GeV = 1e9

b_min_cm = 5.0e6
b_max_cm = 3.0e7
n_b      = 12

rel_tol    = 1e-9
deflection = 1
