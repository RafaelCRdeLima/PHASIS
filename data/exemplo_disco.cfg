# PHASIS -- Fase 3: disco fino em torno de um buraco negro de 10 M_sol.
#
# Aqui rho depende de theta, entao os dois ramos do raio deixam de ser
# iguais e a rota de EDO acoplada entra automaticamente.
#
# r_s(10 M_sol) = 2.95325e6 cm ;  b_crit = 7.6733e6 cm ;  ISCO = 3 r_s

metric  = schwarzschild
M_solar = 10.0

density    = flared_thin_disk
rho0_g_cm3 = 1.0e3
R0_cm      = 1.0e8
H0_cm      = 3.0e6         # H0/R0 = 0.03
p          = 1.875         # 15/8, Shakura-Sunyaev externo
q          = 1.125         # 9/8
r_in_cm    = 8.86e6        # 3 r_s: a ISCO, fisicamente consistente
r_out_cm   = 1.0e10

xsec         = table
table_path   = dipole/data/sigma_nuN_CC_GBW.dat
xsec_current = cc

E_inf_GeV = 1e9

b_min_cm = 8.0e6
b_max_cm = 2.0e8
n_b      = 16

i_min_rad = 0.05
i_max_rad = 1.2
n_i       = 4

psi_t_rad = 0.4

rel_tol     = 1e-9
ode_rel_tol = 1e-9
