# PHASIS -- exemplo: Terra homogenea, secao de choque do dipole (GBW).
#
# Demonstra o acoplamento entre os dois subprojetos: PHASIS consome a
# tabela que PHASIS/dipole produz, POR ARQUIVO. A tabela traz seu proprio
# cabecalho de proveniencia, que o TableCrossSection preserva.

metric   = minkowski

density  = uniform_ball
rho0_g_cm3 = 5.51
R_cm       = 6.371e8

xsec       = table
table_path = dipole/data/sigma_nuN_CC_GBW.dat

# varredura em energia, atravessando o diametro
E_min_GeV = 1e4
E_max_GeV = 1e12
n_E       = 9
b_cm      = 0.0

rel_tol = 1e-10
